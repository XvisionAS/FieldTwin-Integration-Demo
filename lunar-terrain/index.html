<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lunar data import guide</title>
    <!-- Base font when opened outside FieldTwin; inside, FieldTwin's stylesheet takes over -->
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }

      /* Step-by-step lists, shared by the guides' step components */
      ol.steps {
        margin: 8px 0 0;
        padding-left: 20px;
        line-height: 1.4;
      }

      ol.steps > li {
        margin-bottom: 6px;
      }

      .warning {
        display: flex;
        gap: 6px;
        margin: 4px 0 0;
        padding: 4px 6px;
        border-left: 3px solid var(--ftw-button-warning-color);
        background: var(--ftw-input-background-color);
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
